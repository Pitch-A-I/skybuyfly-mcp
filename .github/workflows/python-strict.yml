name: Python strict

on:
  pull_request:
  push:
    branches: [staging, main]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-strict-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # One execution per commit and mode (infrastructure PR1098). Only a
    # pull_request run cancels; a later push run waits and runs. The mode is
    # part of the key, so an incremental PR run whose head is a staging/main
    # commit can never cancel that commit's full push scan.
    concurrency:
      group: python-strict-check-${{ github.event_name == 'pull_request' && 'pr' || 'full' }}-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on:
      group: ci-linux-trusted
      labels: linux-x64-v1
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the anti-bypass trust anchor
        shell: bash
        run: |
          set -euo pipefail
          verifier_path="quality/pitchai_quality/check_no_validation_bypasses.py"
          expected_verifier_sha256="a76465997332e929eeea58dd15dccccb47c847cfd83a1643ca127c20a6db68e7"
          actual_verifier_sha256="$(sha256sum "$verifier_path" | awk '{print $1}')"
          if [[ "$actual_verifier_sha256" != "$expected_verifier_sha256" ]]; then
            printf '%s: SHA-256 trust anchor mismatch (expected %s, got %s)\n' \
              "$verifier_path" "$expected_verifier_sha256" "$actual_verifier_sha256" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked quality environment
        run: uv sync --project quality --python 3.12 --frozen

      - name: Install the locked application analysis environment
        run: UV_PROJECT_ENVIRONMENT=quality/analysis/.venv uv sync --python 3.12 --frozen --all-groups

      - name: Run every fail-closed Python gate
        run: uv run --project quality --python 3.12 --frozen python -m pitchai_quality.ratchet

      - name: Retain analyzer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-strict-reports
          path: .quality-reports/
          include-hidden-files: true
          retention-days: 14
