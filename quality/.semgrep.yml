rules:
  - id: py-try-except-outside-edges
    message: "try/except is only allowed at explicit IO/API/UI/CLI edges; business logic should fail loudly."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: |
          try:
            ...
          except ...:
            ...
      - pattern-not-inside: |
          @router.$METHOD(...)
          def $F(...): ...
      - pattern-not-inside: |
          @router.$METHOD(...)
          async def $F(...): ...
      - pattern-not-inside: |
          @app.$METHOD(...)
          def $F(...): ...
      - pattern-not-inside: |
          @app.$METHOD(...)
          async def $F(...): ...
      - pattern-not-inside: |
          @blueprint.route(...)
          def $F(...): ...
      - pattern-not-inside: |
          @blueprint.route(...)
          async def $F(...): ...
      - pattern-not-inside: |
          @click.command(...)
          def $F(...): ...
      - pattern-not-inside: |
          @app.command(...)
          def $F(...): ...
      - pattern-not-inside: |
          @typer.$CMD(...)
          def $F(...): ...
      - pattern-not-inside: |
          @celery.task(...)
          def $F(...): ...
      - pattern-not-inside: |
          @shared_task(...)
          def $F(...): ...
      - pattern-not-inside: |
          if __name__ == "__main__":
            ...
      # A declared process edge; the process-edges gate holds its handlers to fail-loud endings.
      - pattern-not-inside: |
          @process_edge(...)
          def $F(...): ...
      - pattern-not-inside: |
          @process_edge(...)
          async def $F(...): ...
      # Typed Starlette middleware, and a try around an HTTP client context (installed lineage, Infra 23 Oct).
      - pattern-not-inside: |
          async def __call__(self, scope: starlette.types.Scope, receive: starlette.types.Receive, send: starlette.types.Send) -> ...:
            ...
            await self.app(scope, receive, send)
            ...
      - pattern-not-inside: |
          async def dispatch(self, $REQUEST: starlette.requests.Request, $NEXT: starlette.middleware.base.RequestResponseEndpoint) -> ...:
            ...
            await $NEXT($REQUEST)
            ...
      - pattern-not: |
          try:
            ...
            with httpx.Client(...) as $CLIENT:
              ...
            ...
          except ...:
            ...
      - pattern-not: |
          try:
            ...
            async with httpx.AsyncClient(...) as $CLIENT:
              ...
            ...
          except ...:
            ...
      - pattern-not: |
          try:
            ...
            async with aiohttp.ClientSession(...) as $CLIENT:
              ...
            ...
          except ...:
            ...
      - pattern-not: |
          try:
            ...
            with requests.Session(...) as $CLIENT:
              ...
            ...
          except ...:
            ...

  - id: forbid-requests-outside-infra
    message: "HTTP calls must go through an explicit infrastructure gateway."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: requests.$F(...)
          - pattern: httpx.$F(...)
          - pattern: aiohttp.$F(...)
          - pattern: urllib.request.$F(...)
          - pattern: urllib3.$F(...)
          - pattern: socket.$F(...)
      # A local name that merely shares a module's name is not that module: only a name bound to a plain
      # value (a literal, comprehension, container, str or Path) leaves the rule (installed-lineage review,
      # Infra 23 Oct). A module object, a default argument or a parameter stays reported.
      - pattern: $MOD.$F(...)
      - pattern-not-inside: |
          $MOD = [...]
          ...
      - pattern-not-inside: |
          $MOD = {...}
          ...
      - pattern-not-inside: |
          $MOD = [$ITEM for $NAME in $ITER]
          ...
      - pattern-not-inside: |
          $MOD = {$KEY: $VALUE for $NAME in $ITER}
          ...
      - pattern-not-inside: |
          $MOD = {$ITEM for $NAME in $ITER}
          ...
      - pattern-not-inside: |
          $MOD = list(...)
          ...
      - pattern-not-inside: |
          $MOD = dict(...)
          ...
      - pattern-not-inside: |
          $MOD = set(...)
          ...
      - pattern-not-inside: |
          $MOD = tuple(...)
          ...
      - pattern-not-inside: |
          $MOD = frozenset(...)
          ...
      - pattern-not-inside: |
          $MOD = "..."
          ...
      - pattern-not-inside: |
          $MOD = f"..."
          ...
      - pattern-not-inside: |
          $MOD = str(...)
          ...
      - pattern-not-inside: |
          $MOD = Path(...)
          ...
      - pattern-not-inside: |
          $MOD = pathlib.Path(...)
          ...
      - pattern-not-inside: |
          $MOD = $LEFT / $RIGHT
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = [...]
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = {...}
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = [$ITEM for $NAME in $ITER]
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = {$KEY: $VALUE for $NAME in $ITER}
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = {$ITEM for $NAME in $ITER}
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = list(...)
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = dict(...)
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = set(...)
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = tuple(...)
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = frozenset(...)
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = "..."
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = f"..."
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = str(...)
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = Path(...)
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = pathlib.Path(...)
          ...
      - pattern-not-inside: |
          $MOD: $TYPE = $LEFT / $RIGHT
          ...

  - id: forbid-aws-sdks-outside-infra
    message: "Cloud SDKs must be wrapped in an explicit infrastructure gateway."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: boto3.$F(...)
          - pattern: botocore.$F(...)
          - pattern: aiobotocore.$F(...)

  - id: no-handmade-paths
    message: "Build keys and paths through a naming abstraction in application/interface code."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: Path($X) / $Y
          - pattern: $P.mkdir(..., parents=$Z, ...)
          - pattern: os.path.join($X, $Y, ...)
          - pattern: f".../{...}/..."
          - pattern: $A + "/" + $B
          - pattern: '"/" + $X'
    paths:
      include:
        - "**/app/application/**"
        - "**/app/interfaces/**"
        - "**/src/*/application/**"
        - "**/src/*/interfaces/**"
